<title>Streak</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streak">
<meta name="theme-color" content="#15171a">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<style>
  :root {
    --bg: #edeeea;
    --surface: #ffffff;
    --surface-line: rgba(27, 30, 26, 0.10);
    --ink: #1b1e1a;
    --ink-soft: #63685f;
    --ink-faint: #9a9e93;
    --accent: #b06e26;
    --accent-strong: #8f5a1d;
    --accent-ink: #fffaf1;
    --ring: rgba(176, 110, 38, 0.45);
    --shadow: rgba(27, 30, 26, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171a;
      --surface: #1d2023;
      --surface-line: rgba(237, 235, 227, 0.10);
      --ink: #edebe3;
      --ink-soft: #999c92;
      --ink-faint: #63665d;
      --accent: #e2984a;
      --accent-strong: #f0ac63;
      --accent-ink: #17130c;
      --ring: rgba(226, 152, 74, 0.45);
      --shadow: rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg: #15171a;
    --surface: #1d2023;
    --surface-line: rgba(237, 235, 227, 0.10);
    --ink: #edebe3;
    --ink-soft: #999c92;
    --ink-faint: #63665d;
    --accent: #e2984a;
    --accent-strong: #f0ac63;
    --accent-ink: #17130c;
    --ring: rgba(226, 152, 74, 0.45);
    --shadow: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
  }

  body {
    display: flex;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .screen {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    gap: 20px;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align: center;
    margin: 12px 0 0;
  }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 0;
  }

  .count {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(88px, 30vw, 132px);
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-wrap: balance;
    transform-origin: center;
  }

  .count.pulse { animation: pulse 360ms ease-out; }
  .count.reset { animation: fade-reset 420ms ease-out; }

  @keyframes pulse {
    0% { transform: scale(1); }
    35% { transform: scale(1.12); color: var(--accent); }
    100% { transform: scale(1); }
  }

  @keyframes fade-reset {
    0% { opacity: 1; transform: translateX(0); }
    30% { opacity: 0.3; transform: translateX(-6px); }
    60% { opacity: 0.3; transform: translateX(4px); }
    100% { opacity: 1; transform: translateX(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .count.pulse, .count.reset { animation: none; }
  }

  .unit {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    margin-top: -10px;
  }

  .tally-scroll {
    width: 100%;
    max-width: 340px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scrollbar-width: none;
  }
  .tally-scroll::-webkit-scrollbar { display: none; }

  .tally {
    display: flex;
    gap: 12px;
    width: max-content;
    margin: 0 auto;
    padding: 0 4px;
  }

  .tally-group {
    position: relative;
    display: flex;
    gap: 3px;
    padding: 2px 3px;
  }

  .tally-bar {
    width: 3px;
    height: 26px;
    border-radius: 2px;
    background: var(--ink-faint);
  }

  .tally-group.complete .tally-bar { background: var(--accent); }

  .tally-group.complete::after {
    content: "";
    position: absolute;
    left: -2px;
    right: -2px;
    top: 3px;
    bottom: 3px;
    border-top: 3px solid var(--accent);
    transform: rotate(-32deg);
    border-radius: 2px;
  }

  .stats {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--surface-line);
    border-radius: 14px;
    padding: 12px 18px;
    box-shadow: 0 1px 2px var(--shadow);
  }

  .stats-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .stats-value {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
  }

  .best-chip {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 999px;
    padding: 3px 8px;
    margin-left: 2px;
  }

  .best-chip[hidden] { display: none; }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 4px;
  }

  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    -webkit-appearance: none;
  }

  button:focus-visible {
    outline: 3px solid var(--ring);
    outline-offset: 2px;
  }

  .btn-yes {
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 20px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 6px 16px var(--shadow);
    transition: transform 120ms ease, background 120ms ease;
  }

  .btn-yes:active { transform: scale(0.97); background: var(--accent-strong); }

  .btn-yes svg { width: 22px; height: 22px; flex: none; }

  .btn-no {
    background: transparent;
    color: var(--ink-soft);
    font-size: 15px;
    font-weight: 600;
    padding: 12px;
    border-radius: 12px;
    transition: background 120ms ease, color 120ms ease;
  }

  .btn-no:active { background: var(--surface-line); color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    .btn-yes { transition: none; }
    .btn-yes:active { transform: none; }
  }
</style>

<div class="screen">
  <p class="eyebrow">Current Streak</p>

  <div class="stage">
    <div id="count" class="count">0</div>
    <p id="unit" class="unit">days</p>

    <div class="tally-scroll">
      <div id="tally" class="tally" aria-hidden="true"></div>
    </div>

    <div class="stats">
      <span class="stats-label">Longest</span>
      <span id="longest" class="stats-value">0</span>
      <span id="bestChip" class="best-chip" hidden>Best</span>
    </div>
  </div>

  <div class="actions">
    <button id="yesBtn" class="btn-yes" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
      Yes, kept it today
    </button>
    <button id="noBtn" class="btn-no" type="button">No — reset streak</button>
  </div>
</div>

<script>
  (function () {
    var CUR_KEY = 'streak.current';
    var BEST_KEY = 'streak.longest';

    var countEl = document.getElementById('count');
    var unitEl = document.getElementById('unit');
    var longestEl = document.getElementById('longest');
    var bestChip = document.getElementById('bestChip');
    var tallyEl = document.getElementById('tally');
    var yesBtn = document.getElementById('yesBtn');
    var noBtn = document.getElementById('noBtn');

    var current = parseInt(localStorage.getItem(CUR_KEY), 10);
    var longest = parseInt(localStorage.getItem(BEST_KEY), 10);
    if (!Number.isFinite(current) || current < 0) current = 0;
    if (!Number.isFinite(longest) || longest < 0) longest = 0;

    function save() {
      localStorage.setItem(CUR_KEY, String(current));
      localStorage.setItem(BEST_KEY, String(longest));
    }

    function renderTally(n) {
      tallyEl.innerHTML = '';
      if (n === 0) return;
      var remaining = n;
      while (remaining > 0) {
        var take = Math.min(5, remaining);
        var group = document.createElement('div');
        group.className = 'tally-group' + (take === 5 ? ' complete' : '');
        for (var i = 0; i < take; i++) {
          var bar = document.createElement('span');
          bar.className = 'tally-bar';
          group.appendChild(bar);
        }
        tallyEl.appendChild(group);
        remaining -= take;
      }
    }

    function render() {
      countEl.textContent = String(current);
      unitEl.textContent = current === 1 ? 'day' : 'days';
      longestEl.textContent = String(longest);
      bestChip.hidden = !(current > 0 && current === longest);
      renderTally(current);
    }

    yesBtn.addEventListener('click', function () {
      current += 1;
      if (current > longest) longest = current;
      save();
      render();
      countEl.classList.remove('pulse');
      void countEl.offsetWidth;
      countEl.classList.add('pulse');
    });

    noBtn.addEventListener('click', function () {
      if (current === 0) return;
      current = 0;
      save();
      render();
      countEl.classList.remove('reset');
      void countEl.offsetWidth;
      countEl.classList.add('reset');
    });

    render();
  })();
</script>
